<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Wise &amp; Savvy — A Studio of Worlds</title>
<meta name="description" content="Wise &amp; Savvy is Joshua Blake's studio. Five worlds — EverAfterAI, Root Races, WiseGold, Power Studio, and Texas Lottery Oracle — each with their own surface, all carrying one voice."/>
<meta property="og:title" content="Wise &amp; Savvy — A Studio of Worlds"/>
<meta property="og:description" content="A dark creative technology studio exploring AI, noir fiction, symbolic systems, social currency, and digital worlds."/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://wiseandsavvy.com"/>
<link rel="stylesheet" href="colors_and_type.css"/>
<link rel="stylesheet" href="styles.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel">
  function App() {
    const [active, setActive] = useState("studio");
    const scrollTo = (id) => {
      setActive(id);
      const el = document.getElementById(id);
      if (el) window.scrollTo({ top: el.offsetTop - 60, behavior: "smooth" });
    };
    return (
      <>
        <AmbientBackground/>
        <div className="ws-app">
          <SiteHeader active={active} onNav={scrollTo}/>
          <Hero onEnter={() => scrollTo("worlds")}/>
          <VectorDivider/>
          <WorldsLedger onOpen={(id) => scrollTo("artifacts")}/>
          <VectorDivider flip/>
          <Artifacts/>
          <VectorDivider/>
          <Inquiries/>
          <SiteFooter/>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
